# Dagu tutorial, lesson 9: https://docs.dagu.sh/tutorial/human-input

steps:
  - id: build
    run: echo "Built release 1.4.0"

  - id: choose_target
    action: human.task
    with:
      prompt: Check the build, then choose where release 1.4.0 goes
      form:
        type: object
        properties:
          environment:
            type: string
            enum: [staging, production]
        required: [environment]
    depends: build

  - id: deploy
    run: echo "Deploying 1.4.0 to ${steps.choose_target.outputs.environment}"
    depends: choose_target
