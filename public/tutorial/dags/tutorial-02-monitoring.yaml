# Dagu tutorial, lesson 2: https://docs.dagu.sh/tutorial/monitoring

steps:
  - id: download
    action: wait.duration
    with:
      duration: 5s

  - id: transform
    action: wait.duration
    with:
      duration: 3s
    depends: download

  - id: publish
    run: echo "Published the report"
    depends: transform
