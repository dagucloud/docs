# Dagu tutorial, lesson 2: https://docs.dagu.sh/tutorial/monitoring
description: A slow run to watch live in the Web UI
type: graph

steps:
  - id: download
    run: |
      for part in 1 2 3 4 5; do
        echo "Downloaded part $part of 5"
        sleep 1
      done

  - id: transform
    run: |
      for batch in 1 2 3; do
        echo "Transformed batch $batch of 3"
        sleep 1
      done
    depends: download

  - id: publish
    run: echo "Published 3 batches"
    depends: transform
