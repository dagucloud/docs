# Dagu tutorial, lesson 3: https://docs.dagu.sh/tutorial/params-and-outputs

params:
  - name: environment
    type: string
    enum: [dev, staging, prod]
    default: dev
  - name: version
    default: "1.0.0"

steps:
  - id: build
    run: echo "app-${params.version}.tar.gz"
    output:
      bundle:
        from: stdout

  - id: deploy
    run: echo "Deploying ${steps.build.outputs.bundle} to ${params.environment}"
    depends: build
