# Dagu tutorial, lesson 5: https://docs.dagu.sh/tutorial/control-flow

params:
  - environment: staging
  - notes: ""

steps:
  - id: choose_target
    action: router.route
    with:
      value: ${params.environment}
      routes:
        staging: [deploy_staging]
        prod: [deploy_prod]

  - id: deploy_staging
    run: echo "Deployed to staging"

  - id: deploy_prod
    run: echo "Deployed to prod"

  - id: publish_notes
    run: echo "Release notes - ${params.notes}"
    preconditions:
      - condition: "${params.notes}"
        expected: "re:.+"
    depends: [deploy_staging, deploy_prod]
