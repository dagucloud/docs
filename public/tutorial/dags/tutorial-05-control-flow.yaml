# Dagu tutorial, lesson 5: https://docs.dagu.sh/tutorial/control-flow

params:
  - environment: staging

steps:
  - id: choose_target
    action: router.route
    with:
      value: ${params.environment}
      routes:
        staging: [deploy_staging]
        prod: [deploy_prod]

  - id: deploy_staging
    run: echo "Deployed to staging"

  - id: deploy_prod
    run: echo "Deployed to prod"

  - id: wait_until_healthy
    working_dir: ${context.paths.artifacts_dir}
    run: |
      echo check >> checks.txt
      count=$(wc -l < checks.txt | tr -d ' ')
      echo "Health check $count"
      [ "$count" -ge 3 ] && echo "Healthy"
    repeat_policy:
      repeat: until
      interval_sec: 1
      limit: 10
    depends: [deploy_staging, deploy_prod]
