# Dagu tutorial, lesson 4: https://docs.dagu.sh/tutorial/actions

steps:
  - id: fetch_todos
    action: http.request
    with:
      method: GET
      url: https://jsonplaceholder.typicode.com/todos?userId=1
      silent: true
    output:
      todos:
        from: stdout

  - id: summarize
    action: js.run
    with:
      input: ${steps.fetch_todos.outputs.todos}
      script: |
        const open = input.filter((todo) => !todo.completed);
        return `Still open: ${open.length}. Next up: ${open[0].title}`;
    depends: fetch_todos
