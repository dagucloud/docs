# Dagu tutorial, lesson 7: https://docs.dagu.sh/tutorial/sub-dags

steps:
  - id: build
    run: echo "app-1.4.0.tar.gz"
    output:
      bundle:
        from: stdout

  - id: smoke_test
    action: dag.run
    with:
      dag: smoke-test
      params:
        region: ${ITEM}
        bundle: ${steps.build.outputs.bundle}
    parallel:
      items: [us-east, eu-west, ap-south]
      max_concurrent: 2
    depends: build

---
name: smoke-test
steps:
  - id: check
    run: sleep 1 && echo "${params.bundle} is healthy in ${params.region}"
