# Dagu tutorial, lesson 1: https://docs.dagu.sh/tutorial/first-workflow

steps:
  - id: checkout
    run: echo "Fetched the source code"

  - id: lint
    run: echo "Lint passed"
    depends: checkout

  - id: test
    run: echo "12 tests passed"
    depends: checkout

  - id: package
    run: echo "Packaged app.tar.gz"
    depends: [lint, test]
