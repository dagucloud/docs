# Dagu tutorial, lesson 6: https://docs.dagu.sh/tutorial/failures-and-retries
description: Retry a flaky step, tolerate an optional failure, and clean up
type: graph

handler_on:
  failure:
    run: echo "Alert - the run failed"
  exit:
    run: echo "Cleanup - runs after every run"

steps:
  - id: call_api
    working_dir: ${context.paths.artifacts_dir}
    run: |
      if [ -f attempted ]; then
        echo "API responded"
      else
        touch attempted
        echo "API timed out" >&2
        exit 1
      fi
    retry_policy:
      limit: 2
      interval_sec: 2

  - id: warm_cache
    run: |
      echo "Cache server unreachable" >&2
      exit 1
    continue_on: failed

  - id: publish
    run: echo "Published the report"
    timeout_sec: 30
    depends: [call_api, warm_cache]
