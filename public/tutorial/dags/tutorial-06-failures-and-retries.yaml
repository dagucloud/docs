# Dagu tutorial, lesson 6: https://docs.dagu.sh/tutorial/failures-and-retries

handler_on:
  failure:
    run: echo "Alert - the run failed"
  exit:
    run: echo "Cleanup - runs after every run"

steps:
  - id: warm_cache
    action: http.request
    with:
      method: GET
      url: http://localhost:9 # No cache server listens here
    retry_policy:
      limit: 2
      interval_sec: 1
    continue_on: failed

  - id: publish
    run: echo "Published the report"
    depends: warm_cache
