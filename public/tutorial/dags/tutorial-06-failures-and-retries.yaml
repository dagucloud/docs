# Dagu tutorial, lesson 6: https://docs.dagu.sh/tutorial/failures-and-retries

handler_on:
  failure:
    run: echo "Alert - the run failed"
  exit:
    run: echo "Cleanup - runs after every run"

steps:
  - id: call_api
    working_dir: ${context.paths.artifacts_dir}
    run: |
      if [ -f attempted ]; then echo "API responded"; exit 0; fi
      touch attempted; echo "API timed out" >&2; exit 1
    retry_policy:
      limit: 2
      interval_sec: 2

  - id: warm_cache
    run: echo "Cache server unreachable" >&2; exit 1
    continue_on: failed

  - id: publish
    run: echo "Published the report"
    depends: [call_api, warm_cache]
